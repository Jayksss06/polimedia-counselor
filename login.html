<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentikasi - Polimedia Peer Counselor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-blue': '#00668F',
                        'brand-dark': '#004A6A',
                        'hero-bg': '#EAF5F2',
                    },
                    fontFamily: { 'sans': ['Inter', 'system-ui'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { background-color: #F8FAFC; }
        
        /* Animasi standar untuk memuat masuk */
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Modifikasi untuk menghilangkan panah (spin-button) pada input NIM berjenis angka */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
        input[type="number"] { -moz-appearance: textfield; }
    </style>
</head>
<body class="font-sans text-gray-800 min-h-screen flex items-center justify-center p-6 relative">

    <div class="w-full max-w-md bg-white rounded-[32px] p-8 md:p-10 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-32 h-32 bg-hero-bg rounded-bl-full -z-10"></div>

        <div class="text-center mb-8 relative z-10">
            <h2 class="text-brand-blue font-semibold italic text-xl tracking-wide mb-6">Polimedia Peer Counselor</h2>
            <h1 class="text-2xl font-extrabold text-gray-900 mb-2">Selamat Datang</h1>
            <p class="text-sm text-gray-500">Masuk ke akun Anda untuk melanjutkan sesi.</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5 fade-in relative z-10">
            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Email Mahasiswa</label>
                <input type="email" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-brand-blue focus:ring-1 focus:ring-brand-blue transition" placeholder="nim@mahasiswa.polimedia.ac.id">
            </div>
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest">Kata Sandi</label>
                    <a href="#" class="text-[10px] font-bold text-brand-blue hover:underline">Lupa Sandi?</a>
                </div>
                <input type="password" id="loginPassword" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-brand-blue focus:ring-1 focus:ring-brand-blue transition" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-brand-blue hover:bg-brand-dark text-white font-bold py-3.5 rounded-xl transition shadow-md mt-4">
                Masuk ke Akun
            </button>
            <div class="text-center text-sm text-gray-500 pt-4">
                Belum punya akun? 
                <button type="button" onclick="bukaModal()" class="font-bold text-brand-blue hover:underline">Daftar sekarang</button>
            </div>
        </form>
    </div>

    <div id="modalRegistrasi" class="fixed inset-0 z-50 hidden items-center justify-center px-4">
        <div class="absolute inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity cursor-pointer" onclick="tutupModal()"></div>
        
        <div class="relative bg-white w-full max-w-lg rounded-[32px] p-8 md:p-10 shadow-2xl z-10 max-h-[90vh] overflow-y-auto fade-in">
            <button onclick="tutupModal()" class="absolute top-6 right-6 w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 text-gray-500 hover:bg-red-50 hover:text-red-500 transition">✕</button>
            
            <div class="mb-8">
                <h2 class="text-2xl font-extrabold text-gray-900 mb-2">Buat Akun Baru</h2>
                <p class="text-sm text-gray-500">Lengkapi data rekam jejak mahasiswa Anda.</p>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5">Nama Lengkap</label>
                    <input type="text" id="regNama" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-blue transition" placeholder="John Doe">
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5">NIM (Hanya Angka)</label>
                        <input type="number" id="regNIM" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-blue transition" placeholder="23000000">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5">Program Studi</label>
                        <select id="regProdi" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-blue transition cursor-pointer">
                            <option value="" disabled selected>Pilih Program Studi...</option>
                            <option value="Animasi">Animasi</option>
                            <option value="Desain Grafis">Desain Grafis</option>
                            <option value="Desain Mode">Desain Mode</option>
                            <option value="Fotografi">Fotografi</option>
                            <option value="Pemeliharaan Mesin">Pemeliharaan Mesin</option>
                            <option value="Penerbitan">Penerbitan</option>
                            <option value="Pengelolaan Perhotelan">Pengelolaan Perhotelan</option>
                            <option value="Penyiaran">Penyiaran</option>
                            <option value="Periklanan">Periklanan</option>
                            <option value="Produksi Film dan TV">Produksi Film dan TV</option>
                            <option value="Seni Kuliner">Seni Kuliner</option>
                            <option value="Teknik Grafika">Teknik Grafika</option>
                            <option value="Teknologi Permainan">Teknologi Permainan</option>
                            <option value="Teknologi Rekayasa Multimedia">Teknologi Rekayasa Multimedia</option>
                            <option value="Teknologi Rekayasa Pengemasan">Teknologi Rekayasa Pengemasan</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5">Semester</label>
                        <select id="regSemester" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-blue transition cursor-pointer">
                            <option value="" disabled selected>Pilih Semester...</option>
                            <option value="1">1</option><option value="2">2</option>
                            <option value="3">3</option><option value="4">4</option>
                            <option value="5">5</option><option value="6">6</option>
                            <option value="7">7</option><option value="8">8</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5">No. WhatsApp</label>
                        <input type="tel" id="regWhatsApp" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-blue transition" placeholder="08123456789">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5">Email Akses</label>
                    <input type="email" id="regEmail" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-blue transition" placeholder="Gunakan email kampus">
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5">Buat Sandi</label>
                    <input type="password" id="regPassword" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-blue transition" placeholder="Minimal 6 karakter">
                </div>
                
                <button type="submit" class="w-full bg-brand-blue hover:bg-brand-dark text-white font-bold py-3.5 rounded-xl transition shadow-md mt-6">
                    Buat Akun Sekarang
                </button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Logika Pengendali Pop-Up Modal
        function bukaModal() {
            const modal = document.getElementById('modalRegistrasi');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden'; // Mengunci scroll body saat modal terbuka
        }

        function tutupModal() {
            const modal = document.getElementById('modalRegistrasi');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = 'auto'; // Mengembalikan scroll body
            document.getElementById('registerForm').reset(); // Mengosongkan form saat ditutup
        }

        // Modifikasi alias untuk api.js (karena api.js memanggil toggleView('login') saat registrasi sukses)
        window.toggleView = function(view) {
            if(view === 'login') {
                tutupModal();
            }
        };

        // Memblokir akses jika pengguna sudah berstatus login
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof window.supabaseClient !== 'undefined') {
                const { data: { session } } = await window.supabaseClient.auth.getSession();
                if (session) {
                    window.location.href = 'index.html'; 
                }
            }
        });
    </script>
</body>
</html>
