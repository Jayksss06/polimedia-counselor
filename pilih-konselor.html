<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Konselor - Polimedia Peer Counselor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-blue': '#00668F',
                        'brand-dark': '#004A6A',
                        'brand-light': '#F4F7F9',
                        'brand-green': '#4CAF50',
                    },
                    fontFamily: {
                        'sans': ['Inter', 'ui-sans-serif', 'system-ui'],
                    }
                }
            }
        }
    </script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');</style>
</head>
<body class="bg-brand-light font-sans text-gray-800 min-h-screen flex flex-col">

    <nav class="flex justify-between items-center px-6 md:px-12 py-5 bg-white border-b border-gray-100 sticky top-0 z-50">
        <div class="text-brand-blue font-semibold italic text-lg tracking-wide">Polimedia Peer Counselor</div>
        <div class="hidden md:flex gap-8 text-sm font-medium text-gray-500">
            <a href="index.html" class="hover:text-brand-blue transition">Beranda</a>
            <a href="riwayat.html" class="hover:text-brand-blue transition">Riwayat</a>
            <a href="pilih-konselor.html" class="hover:text-brand-blue transition">Jelajahi</a>
            <a href="tentang.html" class="hover:text-brand-blue transition">Tentang Kami</a>
        </div>
        <div class="flex gap-4 text-gray-400 items-center">
            <a href="login.html" title="Login / Register" class="w-8 h-8 bg-gray-50 rounded-full border border-gray-200 flex items-center justify-center overflow-hidden">
                <img data-nav="avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Guest" class="w-full h-full object-cover">
            </a>
            <button data-action="logout" class="text-xs font-bold text-red-500 hidden" id="btnLogout">Keluar</button>
        </div>
    </nav>

    <main class="flex-grow px-6 md:px-12 py-10 w-full max-w-5xl mx-auto">
        <a href="pilih-konselor.html" class="inline-flex items-center gap-2 text-sm text-gray-500 hover:text-brand-blue mb-8 transition font-medium">
            <span>←</span> Kembali ke Daftar Konselor
        </a>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 items-start">
            
            <div class="md:col-span-1 bg-white p-8 rounded-[30px] border border-gray-100 shadow-sm text-center">
                <div class="w-24 h-24 mx-auto rounded-full bg-blue-100 text-brand-blue flex items-center justify-center font-bold text-3xl mb-4 overflow-hidden">
                    <img data-nav="avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Counselor" class="w-full h-full object-cover" id="avatar-konselor">
                </div>
                
                <h1 class="text-2xl font-bold text-gray-900 mb-1" data-konselor="nama">Memuat...</h1>
                <p class="text-xs text-gray-400 mb-4" data-konselor="info">-</p>
                
                <div class="flex items-center justify-center gap-1 text-brand-green text-sm mb-8">
                    ★ <span data-konselor="rating" class="font-medium ml-1 text-gray-600">0.0 / 5.0 (0 Sesi)</span>
                </div>

                <a href="#" data-action="buat-janji" class="block w-full bg-brand-blue hover:bg-brand-dark text-white py-3.5 rounded-2xl font-bold transition shadow-md">
                    Buat Janji Temu
                </a>
            </div>

            <div class="md:col-span-2 space-y-6">
                
                <div class="bg-white p-8 rounded-[30px] border border-gray-100 shadow-sm">
                    <h2 class="font-bold text-lg text-gray-900 mb-4">Tentang Konselor</h2>
                    <p class="text-sm text-gray-600 leading-relaxed" data-konselor="bio">
                        Memuat deskripsi bio konselor...
                    </p>
                </div>

                <div class="bg-white p-8 rounded-[30px] border border-gray-100 shadow-sm">
                    <h2 class="font-bold text-lg text-gray-900 mb-6">Ulasan Mahasiswa</h2>
                    
                    <div class="space-y-4" data-section="ulasan-konselor">
                        <div class="text-center py-6 text-gray-400 text-sm">Memuat ulasan...</div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="mt-8 text-center pb-8 border-t border-gray-100 pt-8">
        <p class="text-[10px] text-gray-400 font-medium">© 2026 Polimedia Peer Counselor.</p>
    </footer>

    <script src="js/api.js"></script>
</body>
</html>
